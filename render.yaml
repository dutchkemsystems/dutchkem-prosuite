# Render Blueprint — Backend (Express + Convex)
services:
  - type: web
    name: dutchkem-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node index.mjs
    plan: free
    envVars:
      - key: VITE_CONVEX_URL
        sync: false
      - key: CONVEX_SITE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET_CLIENT
        sync: false
      - key: JWT_SECRET_ADMIN
        sync: false
      - key: REFRESH_SECRET
        sync: false

      # 💳 Kora Pay (payments + payouts)
      - key: KORA_PUBLIC_KEY
        sync: false
      - key: KORA_SECRET_KEY
        sync: false
      - key: KORA_ENCRYPTION_KEY
        sync: false
      - key: KORA_PAY_WEBHOOK_SECRET
        sync: false

      # 🤖 NVIDIA NIM AI
      - key: NVIDIA_NIM_API_KEY
        sync: false

      # 📱 Termii SMS (OTP)
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SECRET
        sync: false
      - key: TERMII_CHANNEL
        value: dnd
      - key: TERMII_SENDER_ID
        value: Dutchkem

      # 📧 Email (Resend — admin alerts, OTP)
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: security@dutchkem.com
      - key: ALERT_EMAIL
        value: admin@dutchkem.com

      # 🔐 Encryption (required for payout decryption)
      - key: ENCRYPTION_KEY
        sync: false

      # 🔗 Composio (11 social platforms)
      - key: COMPOSIO_API_KEY
        sync: false

      # ⏱️ Session timeouts
      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: ADMIN_SESSION_TIMEOUT_MINUTES
        value: "15"

      # 🌐 Frontend
      - key: FRONTEND_URL
        sync: false

      # ⚙️ Server
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production

      # 🔄 Auth Migration
      - key: AUTH_MIGRATION_PHASE
        value: cleanup
      - key: AUTH_MIGRATION_ADMIN_KEY
        sync: false
      - key: NEW_AUTH_ENABLED
        value: "true"

      # 🔗 Social Platform OAuth
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false

      # 🏦 Daily Sweep (encrypted destination override)
      - key: DAILY_SWEEP_ACCOUNT_NUMBER_ENCRYPTED
        sync: false
      - key: DAILY_SWEEP_ACCOUNT_NAME_ENCRYPTED
        sync: false
      - key: DAILY_SWEEP_BANK_CODE
        sync: false
      - key: DAILY_SWEEP_BANK_NAME
        sync: false
      - key: DAILY_SWEEP_IV
        sync: false
      - key: DAILY_SWEEP_TAG
        sync: false

      # 🔑 Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://dutchkem-api.onrender.com/auth/google/callback

      # 🕊️ Charity / Tithe Deduction
      - key: CHARITY_ENABLED
        value: "true"
      - key: CHARITY_MONTHLY_PERCENT
        value: "10"
      - key: CHARITY_BANK_CODE
        value: "999999"
      - key: CHARITY_ACCOUNT_NUMBER
        value: "8121161202"
      - key: CHARITY_ACCOUNT_NAME
        value: "Oladotun Alabi"
      - key: CHARITY_AUTO_TRANSFER_DAY
        value: "last"
      - key: CHARITY_AUTO_TRANSFER_TIME
        value: "23:59"

  # ─────────────────────────────────────────────────────────────────────────
  # Dutchkem Ventures Presents: Lagos Run — Hustle Empire
  # API service (dutchkem-lagos-run/backend). Additive: the service above is
  # untouched. © 2026 Dutchkem Ventures. All rights reserved.
  #
  # plan: starter is required — a free instance has no persistent disk, so the
  # wallet file would reset on every deploy and a paid Kobo balance would
  # vanish. `generateValue: true` lets Render mint the signing secrets.
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: dutchkem-lagos-run-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: dutchkem-lagos-run/backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: lagosrun-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/lagosrun.db
      # Exact client origins, comma-separated, no trailing slash, no wildcards.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: SCORE_SIGNING_SECRET
        generateValue: true
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true
      # Kora signs webhooks with the secret key; the webhook secret is an
      # optional rotation override.
      - key: KORAPAY_PUBLIC_KEY
        sync: false
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: KORAPAY_BASE_URL
        value: https://api.korapay.com/merchant/api/v1
      - key: KORA_REDIRECT_URL
        sync: false
      - key: KORA_WEBHOOK_URL
        value: https://dutchkem-lagos-run-api.onrender.com/api/purchases/kora/webhook
      - key: ADMIN_WEBHOOK_URL
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.dutchkem.lagosrun
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APPLE_SHARED_SECRET
        sync: false
