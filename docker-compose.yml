name: dutchkem-prosuite

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dutchkem-prosuite:latest
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
    restart: unless-stopped

# NOTE: The Convex backend is external (https://warmhearted-aardvark-280.convex.cloud).
# Set VITE_CONVEX_URL / CONVEX_URL in the environment when wiring real Convex auth.
# No local database or Redis is required for the frontend container.