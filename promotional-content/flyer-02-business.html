<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  .poster {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f766e 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    position: relative; overflow: hidden;
  }
  .accent-bar {
    position: absolute; top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, #14b8a6, #06b6d4, #8b5cf6);
  }
  .content { position: relative; z-index: 2; text-align: center; padding: 60px; }
  .tag {
    display: inline-block; border: 2px solid #14b8a6; color: #14b8a6;
    padding: 10px 28px; border-radius: 8px; font-size: 18px;
    font-weight: 700; letter-spacing: 3px; margin-bottom: 40px; text-transform: uppercase;
  }
  h1 {
    color: white; font-size: 68px; font-weight: 900; line-height: 1.15;
    margin-bottom: 30px;
  }
  h1 span { color: #14b8a6; }
  .stats {
    display: flex; gap: 50px; margin: 40px 0 50px; justify-content: center;
  }
  .stat { text-align: center; }
  .stat-number { color: #14b8a6; font-size: 56px; font-weight: 900; }
  .stat-label { color: rgba(255,255,255,0.6); font-size: 18px; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .divider { width: 120px; height: 3px; background: linear-gradient(90deg, #14b8a6, #8b5cf6); margin: 0 auto 40px; border-radius: 2px; }
  .desc {
    color: rgba(255,255,255,0.75); font-size: 24px; line-height: 1.6;
    max-width: 700px; margin: 0 auto 50px;
  }
  .cta {
    display: inline-block; background: linear-gradient(135deg, #14b8a6, #06b6d4);
    color: white; padding: 22px 60px; border-radius: 60px; font-size: 26px;
    font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    box-shadow: 0 8px 40px rgba(20,184,166,0.4); text-decoration: none;
  }
  .url { color: rgba(255,255,255,0.4); font-size: 18px; margin-top: 25px; }
</style>
</head>
<body>
<div class="poster">
  <div class="accent-bar"></div>
  <div class="content">
    <div class="tag">AI-Powered Business Platform</div>
    <h1>Automate.<br><span>Grow.</span><br>Dominate.</h1>
    <div class="stats">
      <div class="stat"><div class="stat-number">15</div><div class="stat-label">AI Agents</div></div>
      <div class="stat"><div class="stat-number">24/7</div><div class="stat-label">Automation</div></div>
      <div class="stat"><div class="stat-number">60%</div><div class="stat-label">Cost Savings</div></div>
    </div>
    <div class="divider"></div>
    <p class="desc">From business plans to academic writing, content creation to financial planning — your complete AI workforce, ready in minutes.</p>
    <a class="cta" href="https://dutchkem-prosuite-app.vercel.app">Get Started Free</a>
    <p class="url">dutchkem-prosuite-app.vercel.app</p>
  </div>
</div>
</body>
</html>
