apiVersion: apps/v1
kind: Deployment
metadata:
  name: prosuite
  labels:
    app: prosuite
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prosuite
  template:
    metadata:
      labels:
        app: prosuite
    spec:
      containers:
        - name: prosuite
          image: dutchkem/prosuite:latest
          ports:
            - containerPort: 4173
          env:
            - name: NODE_ENV
              value: "production"
            - name: VITE_CONVEX_URL
              value: "https://warmhearted-aardvark-280.convex.cloud"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prosuite
  labels:
    app: prosuite
spec:
  selector:
    app: prosuite
  ports:
    - port: 80
      targetPort: 4173
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prosuite
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: prosuite.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prosuite
                port:
                  number: 80
  tls:
    - hosts:
        - prosuite.example.com
      secretName: prosuite-tls
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prosuite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prosuite
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70